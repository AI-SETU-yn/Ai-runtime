input:
  rules:
    - id: input.max_length
      description: Blocks unusually large prompts that can degrade quality or exhaust runtime capacity.
      enabled: true
      type: max_length
      action: block
      target: message
      max_length: 4000
      message: Input exceeds the maximum allowed length.
      tags:
        - availability
        - abuse-prevention
    - id: input.prompt_injection
      description: Flags common prompt-injection and instruction-override attempts for AI security classification.
      enabled: true
      type: regex
      action: block
      target: message
      patterns:
        - '(?i)ignore\s+(all|previous|prior)\s+(instructions|rules|prompts)'
        - '(?i)disregard\s+(all|previous|prior)\s+(instructions|rules|prompts)'
        - '(?i)(reveal|show|tell|give)(?:\s+me)?\s+(?:the\s+)?(system prompt|hidden instructions|developer prompt)'
        - '(?i)bypass\s+(security|guardrails|safety)'
      message: Request requires AI security review.
      tags:
        - suspicious
        - prompt-injection
        - security
    - id: input.secret_exfiltration
      description: Flags requests that explicitly ask for credentials, tokens, or secrets.
      enabled: true
      type: regex
      action: block
      target: message
      patterns:
        - '(?i)(api[_ -]?key|access[_ -]?token|refresh[_ -]?token|private[_ -]?key|secret)'
      message: Request requires AI security review.
      tags:
        - suspicious
        - secret-protection
        - data-loss-prevention
    - id: input.pii_bearer_token
      description: Blocks input that contains a live bearer token value (not merely a mention of one).
      enabled: true
      type: regex
      action: block
      target: message
      patterns:
        - '(?i)\bbearer\s+[a-z0-9\-._~+/]+=*'
      message: Input contains a bearer token and was blocked before reaching the model.
      tags:
        - secrets
        - pii
        - data-loss-prevention
    - id: input.pii_api_key
      description: Blocks input that contains an API-key-shaped value (vendor-prefixed or explicit key=value assignment).
      enabled: true
      type: regex
      action: block
      target: message
      patterns:
        - '(?i)\bsk-[a-zA-Z0-9]{20,}\b'
        - '\bAKIA[0-9A-Z]{16}\b'
        - '\bAIza[0-9A-Za-z\-_]{35}\b'
        - '\bgh[pousr]_[A-Za-z0-9]{36}\b'
        - '(?i)\b(api[_ -]?key|access[_ -]?key)\s*[:=]\s*["'']?[A-Za-z0-9_\-]{16,}["'']?'
      message: Input contains an API key and was blocked before reaching the model.
      tags:
        - secrets
        - pii
        - data-loss-prevention
    - id: input.pii_jwt
      description: Blocks input that contains a JSON Web Token (three dot-separated base64url segments).
      enabled: true
      type: regex
      action: block
      target: message
      patterns:
        - '\bey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
      message: Input contains a JWT and was blocked before reaching the model.
      tags:
        - secrets
        - pii
        - data-loss-prevention
    - id: input.pii_credit_card
      description: Blocks input that contains a credit-card-like number (major issuer prefixes).
      enabled: true
      type: regex
      action: block
      target: message
      patterns:
        - '\b4[0-9]{3}[\s-]?[0-9]{4}[\s-]?[0-9]{4}[\s-]?[0-9]{1,4}\b'
        - '\b5[1-5][0-9]{2}[\s-]?[0-9]{4}[\s-]?[0-9]{4}[\s-]?[0-9]{4}\b'
        - '\b3[47][0-9]{2}[\s-]?[0-9]{6}[\s-]?[0-9]{5}\b'
        - '\b6(?:011|5[0-9]{2})[\s-]?[0-9]{4}[\s-]?[0-9]{4}[\s-]?[0-9]{4}\b'
      message: Input contains a card-like number and was blocked before reaching the model.
      tags:
        - secrets
        - pii
        - data-loss-prevention
    - id: input.pii_email
      description: Flags email addresses present in the input. Non-blocking -- annotated for downstream awareness only.
      enabled: true
      type: regex
      action: annotate
      target: message
      patterns:
        - '\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
      flags:
        - IGNORECASE
      tags:
        - pii
        - email
    - id: input.pii_phone
      description: Flags phone-number-like sequences present in the input. Non-blocking -- annotated for downstream awareness only.
      enabled: true
      type: regex
      action: annotate
      target: message
      patterns:
        - '(?<![\w-])(?:\+?\d{1,3}[\s().-]+)?(?:\d[\s().-]*){10,13}\d(?![\w-])'
      exempt_patterns:
        - '^\s*(?:[A-Za-z][A-Za-z\s_-]{0,32}\s*[:\-]?\s*)?(19|20)\d{2}\s*-\s*(19|20)\d{2}\s*$'
        - '^\s*\d{4}[-/]\d{2}[-/]\d{2}\s*$'
        - '^\s*(?:0?[1-9]|1[0-2])[-/](19|20)\d{2}\s*$'
        - '^\s*[A-Za-z]{1,8}\s*(19|20)\d{2}(?:\s*-\s*(19|20)\d{2})?\s*$'
        - '^\s*(?:Q[1-4]|Quarter\s*[1-4])(?:\s*[-/]?\s*(19|20)\d{2})?\s*$'
        - '^\s*[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\s*$'
        - '^[A-Za-z]{2,}\d{2,}[A-Za-z0-9-]*$'
        - '^\d{4,}-[A-Za-z0-9-]{2,}$'
      exempt_context_keys:
        - id
        - date
        - month
        - year
      tags:
        - pii
        - phone
output:
  rules:
    - id: output.authorization_redaction
      description: Redacts bearer tokens from generated responses.
      enabled: true
      type: regex
      action: redact
      target: answer
      patterns:
        - '(?i)bearer\s+[a-z0-9\-._~+/]+=*'
      replacement: '[redacted-token]'
      tags:
        - credentials
        - redaction
    - id: output.email_redaction
      description: Redacts email addresses from generated responses when present.
      enabled: true
      type: regex
      action: redact
      target: answer
      patterns:
        - '\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
      flags:
        - IGNORECASE
      replacement: '[redacted-email]'
      tags:
        - pii
        - redaction
    - id: output.phone_redaction
      description: Redacts phone-number like sequences from generated responses.
      enabled: true
      type: regex
      action: redact
      target: answer
      patterns:
        - '(?<![\w-])(?:\+?\d{1,3}[\s().-]+)?(?:\d[\s().-]*){10,13}\d(?![\w-])'
      exempt_patterns:
        - '^\s*(?:[A-Za-z][A-Za-z\s_-]{0,32}\s*[:\-]?\s*)?(19|20)\d{2}\s*-\s*(19|20)\d{2}\s*$'
        - '^\s*\d{4}[-/]\d{2}[-/]\d{2}\s*$'
        - '^\s*(?:0?[1-9]|1[0-2])[-/](19|20)\d{2}\s*$'
        - '^\s*[A-Za-z]{1,8}\s*(19|20)\d{2}(?:\s*-\s*(19|20)\d{2})?\s*$'
        - '^\s*(?:Q[1-4]|Quarter\s*[1-4])(?:\s*[-/]?\s*(19|20)\d{2})?\s*$'
        - '^\s*[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\s*$'
        - '^[A-Za-z]{2,}\d{2,}[A-Za-z0-9-]*$'
        - '^\d{4,}-[A-Za-z0-9-]{2,}$'
      exempt_context_keys:
        - id
        - date
        - month
        - year
      replacement: '[redacted-phone]'
      tags:
        - pii
        - redaction
security_classifier:
  enabled: true
  mode: hybrid
  always_run: false
  confidence_threshold: 0.9
  suspicious_tags:
    - suspicious
token_budget:
  enabled: true
  # Kept generous relative to input.max_length (~1000-token equivalent) so it
  # acts as a safety net alongside the character limit, not a replacement,
  # until token counting is verified in production. Tune down once verified.
  limit: 6000
