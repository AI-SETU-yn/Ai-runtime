domain: vidhya
service: academic
server: vidhya-mcp
protocol: mcp
transport: streamable-http
tools:
  - id: vidhya.academic.subject.list.get_all_subjects
    name: academic.get_all_subjects
    entity: subject
    operation: list
    description: Fetches all subjects.
    capability: academic.subject.list
    required_parameters: []
    optional_parameters: []
    response_type: structured
    version: 1.0.0
    status: active
    input:
      schema_summary:
        context: VidhyaRequestContext
    output:
      type: json
      identifier_fields:
      - referenceId
      display_fields:
      - subjectName
      display:
        label_template: "{subjectName}"
